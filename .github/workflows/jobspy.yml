name: JobSpy daily feed

on:
  schedule:
    - cron: "17 3 * * *"   # 07:17 Dubai, before the hub refresh at 08:31
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Scrape jobs
        env:
          JOBSPY_PROXY: ${{ secrets.JOBSPY_PROXY }}
        run: python scrape.py
      - name: Save jobs.json
        run: |
          git config user.name "jobspy-bot"
          git config user.email "jobspy-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Daily job feed $(date -u +%F)"
          git push
